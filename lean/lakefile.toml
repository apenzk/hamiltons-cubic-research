name = "HamiltonsCubic"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["HamiltonsCubic"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # this is not a Mathlib upstream package
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "HamiltonsCubic"
